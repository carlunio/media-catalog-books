[build-system]
requires = [
  "setuptools>=82,<85",
  "wheel>=0.45,<1"
]
build-backend = "setuptools.build_meta"

[project]
name = "media-catalog-books"
version = "0.1.1"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
  "streamlit>=1.54,<2",
  "duckdb>=1.4,<2",
  "requests>=2.32,<3",
  "ollama>=0.6,<1",
  "pillow>=12,<13",
  "pillow-heif>=1.3,<2",
  "openai>=2.24,<3",
  "langgraph>=1.0,<2",
  "langcodes[data]>=3.5,<4",
  "python-iso639>=2026.1,<2027",
  "colorama>=0.4,<1",
  "tzdata>=2025.3,<2027"
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<1",
  "black>=26.5,<27",
  "httpx>=0.28,<1",
  "build>=1.6,<2",
  "pip-tools>=7.6,<8"
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.frontend" = ["assets/*.css"]
